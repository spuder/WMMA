name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HLEDGER_VERSION: "1.52.4"
      HLEDGER_SHA256: f76a2e4088e162b7658e43077502569d5a6fdacd219b19bfb9aab6588b69643a
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install hledger
        run: |
          curl -fsSLo /tmp/hledger.tgz "https://github.com/simonmichael/hledger/releases/download/${HLEDGER_VERSION}/hledger-linux-x64.tar.gz"
          echo "${HLEDGER_SHA256}  /tmp/hledger.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/hledger.tgz -C "$HOME/.local/bin" hledger hledger-web
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run --bun tsc --noEmit
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wmma:ci .
      - name: Smoke test
        run: |
          docker run -d --name wmma -e WMMA_ALLOWED_USERS=alice@example.com wmma:ci
          for i in $(seq 30); do docker exec wmma wmma healthcheck && break; sleep 1; done
          docker exec wmma wmma healthcheck
          # From inside the container (the app only listens on localhost):
          code() { docker exec wmma bash -c "exec 3<>/dev/tcp/127.0.0.1/3000; printf 'GET /api/v1/status HTTP/1.0\r\n$1\r\n' >&3; head -1 <&3"; }
          code "" | grep -q " 401 "
          code "Tailscale-User-Login: eve@example.com\r\n" | grep -q " 403 "
          code "Tailscale-User-Login: alice@example.com\r\n" | grep -q " 200 "
          docker exec wmma ls /data/journals/main.journal
      - if: failure()
        run: docker logs wmma
