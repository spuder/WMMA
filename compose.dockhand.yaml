# WMMA as a Dockhand git stack (composePath = compose.dockhand.yaml).
#
# HTTPS ingress comes from docktail (labels below) at
# https://wmma.snowy-vibes.ts.net, same as the other homelab services.
# docktail runs `tailscale serve --service=svc:wmma`, which stamps the
# Tailscale-User-Login / Tailscale-User-Name headers WMMA authenticates on and
# overwrites any copies a client sends. So WMMA_ALLOWED_USERS still applies.
#
# WMMA must listen on 0.0.0.0 (WMMA_HOST) so docktail can reach the container
# IP. No ports are published, so the only paths in are docktail and anything
# on this stack's private Docker network or the Docker host itself. Do not add
# a `ports:` mapping or put other containers on this network: the identity
# header is trusted as-is on those paths.
#
# Same service as compose.yaml (image from GHCR, docktail labels) with one
# difference: Dockhand runs compose from inside its own container, so
# compose.yaml's relative `./data` bind mount would not resolve on the Docker
# host. Data lives in the named volume wmma-data instead (wmma_wmma-data on
# the host). Variables are set on the Dockhand stack and substituted into
# ${...} below.
#
# Pushes to main on Forgejo redeploy this via .forgejo/workflows/deploy.yml,
# which waits for the matching ghcr.io image tag; the stack re-pulls images
# on every deploy.

services:
  wmma:
    image: ghcr.io/spuder/wmma:latest   # built by .github/workflows/docker.yml
    container_name: wmma
    init: true
    environment:
      WMMA_HOST: 0.0.0.0
      WMMA_ALLOWED_USERS: ${WMMA_ALLOWED_USERS:?set WMMA_ALLOWED_USERS}
      WMMA_TZ: ${WMMA_TZ:-UTC}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      WMMA_SECRET_KEY: ${WMMA_SECRET_KEY:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-}
      YNAB_TOKEN: ${YNAB_TOKEN:-}
    volumes:
      - wmma-data:/data
      - wmma-secret-key:/var/lib/wmma-secrets
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=wmma"
      - "docktail.service.port=3000"
      - "docktail.service.service-port=443"

volumes:
  wmma-data:
  wmma-secret-key:
