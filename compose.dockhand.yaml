# WMMA as a Dockhand git stack (composePath = compose.dockhand.yaml).
#
# Same shape as compose.yaml (Tailscale sidecar + WMMA in its network
# namespace, reachable only through Tailscale Serve), adjusted for Dockhand:
#   * Dockhand runs compose from inside its own container, so relative bind
#     mounts (./data, ./deploy/...) would not resolve on the Docker host. Data
#     lives in named volumes and the serve config is written by the sidecar's
#     entrypoint instead.
#   * Variables are not read from a .env file. They are set on the Dockhand
#     stack (TS_AUTHKEY as a secret) and substituted into ${...} below.
#
# Pushes to main on Forgejo redeploy this via .forgejo/workflows/deploy.yml.

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: wmma-tailscale
    hostname: wmma
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /config
        cat > /config/serve.json <<'JSON'
        {
          "TCP": { "443": { "HTTPS": true } },
          "Web": {
            "$${TS_CERT_DOMAIN}:443": {
              "Handlers": { "/": { "Proxy": "http://127.0.0.1:3000" } }
            }
          }
        }
        JSON
        exec /usr/local/bin/containerboot
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  wmma:
    build:
      context: .
      dockerfile: Dockerfile
    image: wmma:local
    container_name: wmma
    network_mode: service:tailscale
    depends_on:
      - tailscale
    init: true
    environment:
      WMMA_ALLOWED_USERS: ${WMMA_ALLOWED_USERS:?set WMMA_ALLOWED_USERS}
      WMMA_TZ: ${WMMA_TZ:-UTC}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      WMMA_SECRET_KEY: ${WMMA_SECRET_KEY:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-}
      YNAB_TOKEN: ${YNAB_TOKEN:-}
    volumes:
      - wmma-data:/data
      - wmma-secret-key:/var/lib/wmma-secrets
    restart: unless-stopped

volumes:
  tailscale-state:
  wmma-data:
  wmma-secret-key:
