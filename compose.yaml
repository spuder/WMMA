# WMMA behind Tailscale Serve.
#
# The wmma container shares the tailscale container's network namespace and
# listens on 127.0.0.1 only, so the ONLY way in is Tailscale Serve, which sets
# the Tailscale-User-* identity headers WMMA trusts (SPEC §2). No ports are
# published to the host.
#
# Secrets come from the environment, e.g. via 1Password:
#   op run --env-file=.env -- docker compose up -d

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: wmma
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  wmma:
    build: .
    image: wmma:local
    network_mode: service:tailscale
    depends_on:
      - tailscale
    init: true
    environment:
      WMMA_ALLOWED_USERS: ${WMMA_ALLOWED_USERS:?set WMMA_ALLOWED_USERS}
      WMMA_TZ: ${WMMA_TZ:-UTC}
      JEV_API_KEY: ${JEV_API_KEY:-}
      SIMPLEFIN_ACCESS_URL: ${SIMPLEFIN_ACCESS_URL:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-}
      YNAB_TOKEN: ${YNAB_TOKEN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
