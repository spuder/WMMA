# WMMA behind docktail (https://github.com/marvinvr/docktail).
#
# Requires a docktail container already running on this Docker host. The labels
# below make docktail run `tailscale serve --service=svc:wmma`, which serves
# https://wmma.<your-tailnet>.ts.net and stamps the Tailscale-User-Login /
# Tailscale-User-Name headers WMMA authenticates on (overwriting any copies a
# client sends), so WMMA_ALLOWED_USERS applies (SPEC §2).
#
# WMMA listens on 0.0.0.0 (WMMA_HOST) so docktail can reach the container IP.
# No ports are published, so the only paths in are docktail and anything on
# this stack's private Docker network or the Docker host itself. Do not add a
# `ports:` mapping or put other containers on this network: the identity header
# is trusted as-is on those paths.
#
# Deployment secrets come from the environment, e.g. via 1Password:
#   op run --env-file=.env -- docker compose up -d
#
# Data lives in the named Docker volumes wmma-data and wmma-secret-key (not a
# ./data bind mount), so the same file works from Dockhand git stacks, whose
# compose runs inside the Dockhand container and can't resolve relative host
# paths.
#
# The image comes from GitHub Container Registry. To run a local build instead:
#   docker build -t ghcr.io/spuder/wmma:latest . && docker compose up -d

name: wmma   # fixes volume names (wmma_wmma-data, wmma_wmma-secret-key) whatever the checkout folder is called

services:
  wmma:
    image: ghcr.io/spuder/wmma:latest   # or pin a release / sha-<commit> tag
    container_name: wmma
    init: true
    environment:
      WMMA_HOST: 0.0.0.0
      WMMA_ALLOWED_USERS: ${WMMA_ALLOWED_USERS:?set WMMA_ALLOWED_USERS}
      WMMA_TZ: ${WMMA_TZ:-UTC}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      # Optional legacy migration key; new SimpleFIN connections use Settings.
      WMMA_SECRET_KEY: ${WMMA_SECRET_KEY:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-}
      YNAB_TOKEN: ${YNAB_TOKEN:-}
    volumes:
      - wmma-data:/data
      - wmma-secret-key:/var/lib/wmma-secrets
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=wmma"
      - "docktail.service.port=3000"
      - "docktail.service.service-port=443"

volumes:
  wmma-data:
  wmma-secret-key:
